services:
  omr:
    build: .
    image: omr:latest
    container_name: omr
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: "40"
      MAX_PAGES: "6"
      ENGINE_TIMEOUT: "900"
      KEEP_HOURS: "72"
      # Which engines to run, in order. oemer is installed but off by default (very slow on CPU).
      ENGINES: "${OMR_ENGINES:-audiveris,homr}"
      OMP_NUM_THREADS: "${OMR_THREADS:-4}"
    volumes:
      - ./data:/data
    ports:
      - "${OMR_BIND:-127.0.0.1}:${OMR_PORT:-8487}:8000"
    mem_limit: "${OMR_MEM:-6g}"
    memswap_limit: "${OMR_MEM:-6g}"
